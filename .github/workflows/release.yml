name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS .app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" build/darwin/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" build/darwin/Info.plist

      - name: Build frontend + macOS app
        run: make macos APP_VERSION="${{ steps.ver.outputs.version }}"

      - name: Package zip
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Platform is implied by extension (.zip = macOS app). Arch stays in the name.
          ditto -c -k --keepParent bin/Swiflow.app "bin/Swiflow-${VERSION}-arm64.zip"
          ls -lh bin/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: bin/Swiflow-*-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install NSIS + make + wails3
        shell: bash
        run: |
          choco install nsis make -y --no-progress
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # Chocolatey NSIS shim or classic install path
          if [[ -d "/c/Program Files (x86)/NSIS" ]]; then
            echo "/c/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
          fi
          if [[ -d "/c/ProgramData/chocolatey/bin" ]]; then
            echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          fi

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if command -v jq >/dev/null && [[ -f build/windows/info.json ]]; then
            tmp=$(mktemp)
            jq --arg v "$VERSION" \
              '.fixed.file_version = $v | .info["0000"].ProductVersion = $v' \
              build/windows/info.json > "$tmp" && mv "$tmp" build/windows/info.json
          fi

      - name: Build Windows installer
        shell: bash
        run: |
          # Ensure make recipes use bash (for loops / test / rm -f).
          export SHELL="$(command -v bash)"
          make windows SHELL="$(command -v bash)" APP_VERSION="${{ steps.ver.outputs.version }}"
          ls -la bin/

      - name: Rename artifacts
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Portable exes are what in-app updater swaps (not the NSIS installer).
          # Platform is implied by .exe; arch stays in the name.
          cp "bin/Swiflow-amd64.exe" "bin/Swiflow-${VERSION}-amd64.exe"
          cp "bin/Swiflow-arm64.exe" "bin/Swiflow-${VERSION}-arm64.exe"
          src="bin/Swiflow-installer.exe"
          dst="bin/Swiflow-${VERSION}-installer.exe"
          test -f "$src"
          mv "$src" "$dst"
          ls -lh bin/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            bin/Swiflow-*-installer.exe
            bin/Swiflow-*-amd64.exe
            bin/Swiflow-*-arm64.exe
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS + Wails update.json
        env:
          VERSION: ${{ github.ref_name }}
          # Public CDN base for in-app updater downloads (synced by sync-to-r2).
          ASSET_BASE: https://r2.swiflow.cc
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, time
          version = os.environ["VERSION"].lstrip("v")
          asset_base = os.environ["ASSET_BASE"].rstrip("/")
          root = pathlib.Path(".")
          artifacts = []

          def add(name, platform, arch, filetype):
              p = root / name
              if not p.is_file():
                  print(f"skip missing {name}")
                  return
              raw = p.read_bytes()
              digest = base64.standard_b64encode(hashlib.sha256(raw).digest()).decode()
              artifacts.append({
                  "url": f"{asset_base}/{name}",
                  "filename": name,
                  "filetype": filetype,
                  "platform": platform,
                  "arch": arch,
                  "size": len(raw),
                  "digestAlgo": "sha256",
                  "digest": digest,
              })

          add(f"Swiflow-{version}-arm64.zip", "darwin", "arm64", "zip")
          add(f"Swiflow-{version}-amd64.exe", "windows", "amd64", "exe")
          add(f"Swiflow-{version}-arm64.exe", "windows", "arm64", "exe")

          manifest = {
              "schemaVersion": 1,
              "version": version,
              "channel": "stable",
              "name": f"Swiflow {version}",
              "notes": "",
              "publishedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "artifacts": artifacts,
          }
          pathlib.Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(pathlib.Path("update.json").read_text())
          PY

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Swiflow ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
