name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Frontend build
        working-directory: webui
        run: pnpm install --frozen-lockfile && pnpm build

      # Skip cmd/desktop: Wails needs platform CGO/WebView, not available on ubuntu runners.
      - name: Go vet / test / build
        env:
          CGO_ENABLED: "0"
        run: |
          go vet $(go list ./... | grep -v '/cmd/desktop$')
          go test $(go list ./... | grep -v '/cmd/desktop$')
          go build -o /dev/null ./cmd/swiflow
