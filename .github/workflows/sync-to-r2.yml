name: Sync Assets to Cloudflare R2

# 注意：用默认 GITHUB_TOKEN 在 release.yml 里创建的 Release，不会触发本 workflow
# （GitHub 禁止 workflow 用 GITHUB_TOKEN 再触发其它 workflow）。
# 打 tag 发版时的 R2 上传已写在 release.yml 的 GitHub Release job 末尾。
# 本 workflow 仍用于：在网页上 Edit Release 后补同步，或手动 workflow_dispatch。
on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync (e.g. v0.9.3)
        required: true

jobs:
  sync-release-to-r2:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
      R2_PREFIX: swiflow

    steps:
      - name: Resolve release id
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="$TAG_INPUT"
            api="https://api.github.com/repos/${{ github.repository }}/releases/tags/${tag}"
            id=$(curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api" | jq -r .id)
          else
            id="${{ github.event.release.id }}"
            tag="${{ github.event.release.tag_name }}"
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Syncing release id=$id tag=$tag"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          api_url="https://api.github.com/repos/${{ github.repository }}/releases/${{ steps.rel.outputs.release_id }}"
          release_info=$(curl -fLsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api_url")

          echo "$release_info" | jq -r '.assets[]?.browser_download_url // empty' | while read -r url; do
            [ -z "$url" ] && continue
            filename="${url##*/}"
            echo "Downloading $filename"
            curl -fL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -o "out/${filename}" \
              "$url"
          done
          ls -lh out/ || true

      - name: Setup R2 credentials
        run: |
          pip install --quiet awscli
          mkdir -p ~/.aws
          printf '%s\n' "[default]" \
            "aws_access_key_id=${{ secrets.R2_ACCESS_KEY_ID }}" \
            "aws_secret_access_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" > ~/.aws/credentials
          printf '%s\n' "[default]" "region=auto" > ~/.aws/config

      - name: Upload to R2
        run: |
          set -euo pipefail
          if [[ -z "${R2_BUCKET_NAME:-}" || -z "${R2_ENDPOINT_URL:-}" ]]; then
            echo "::error::Set repository variables R2_BUCKET_NAME and R2_ENDPOINT_URL"
            exit 1
          fi
          [ -d out ] || exit 0
          shopt -s nullglob
          files=(out/*)
          [ ${#files[@]} -eq 0 ] && echo "No assets to upload" && exit 0
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            key="${R2_PREFIX}/${name}"
            echo "Uploading $name → s3://${R2_BUCKET_NAME}/${key}"
            aws s3 cp "$f" "s3://${R2_BUCKET_NAME}/${key}" \
              --endpoint-url "$R2_ENDPOINT_URL" \
              --no-progress
          done
          echo "Upload complete → https://dl.option.ltd/swiflow/"

      - name: Cleanup
        if: always()
        run: rm -rf out
